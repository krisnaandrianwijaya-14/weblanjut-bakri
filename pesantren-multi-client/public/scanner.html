<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scanner Absensi Pesantren</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 16px;
            background: #0f172a; color: white;
            min-height: 100vh;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
        #result {
            margin-top: 20px; padding: 20px;
            background: #1e293b; border-radius: 12px;
            text-align: center; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .name { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .status {
            display: inline-block; padding: 4px 12px;
            border-radius: 999px; font-size: 13px;
            background: #10b981; color: white;
        }
    </style>
</head>
<body>
    <h1>📷 Scanner Absensi</h1>
    <p class="subtitle">Pesantren Al-Hikmah — Asrama Al-Ghazali</p>

    <div id="reader"></div>
    <div id="result">Arahkan kamera ke QR code santri...</div>

    <script>
        // ⚠️ GANTI IP INI DENGAN IP LAPTOP ANDA (10.253.21.39)
        const API_URL = 'https://purple-tigers-worry.loca.lt/api/attendance/scan';
        const DEVICE_ID = 'DEV-ALHIKMAH-01';

        const html5QrCode = new Html5Qrcode("reader");
        const resultEl = document.getElementById('result');
        let isProcessing = false;

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (decodedText) => {
                if (isProcessing) return;
                isProcessing = true;

                resultEl.innerHTML = '⏳ Memproses...';

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            qr_token: decodedText,
                            device_id: DEVICE_ID,
                            location_type: 'dormitory',
                            location_id: 3,
                        }),
                    });

                    const data = await response.json();

                    if (data.success) {
                        resultEl.innerHTML = `
                            <div>
                                <div class="name success">${data.data.student_name}</div>
                                <div style="color:#94a3b8;margin-bottom:8px;">
                                    ${data.data.student_number}
                                </div>
                                <span class="status">${data.data.status.toUpperCase()}</span>
                            </div>
                        `;
                    } else {
                        resultEl.innerHTML = `<div class="error">❌ ${data.message}</div>`;
                    }
                } catch (e) {
                    resultEl.innerHTML = `<div class="error">❌ Error: ${e.message}</div>`;
                }

                setTimeout(() => {
                    resultEl.innerHTML = 'Arahkan kamera ke QR code santri...';
                    isProcessing = false;
                }, 3000);
            },
            (errorMessage) => { /* ignore */ }
        ).catch(err => {
            resultEl.innerHTML = `<div class="error">❌ Kamera gagal: ${err.message}</div>`;
        });
    </script>
</body>
</html>
